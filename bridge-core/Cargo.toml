[package]
name = "wrzdj-bridge-core"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "The WrzDJ Bridge's core in Rust: decides which deck is live, one piece at a time"
publish = false

[dependencies]
ctrlc = { version = "3", features = ["termination"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
